        :root {

        .contact-header { padding: 100px 0 50px; text-align: center; }
        .contact-header h1 { font-size: 4rem; font-weight: 800; }
        
        .contact-card {
            background: var(--card-bg);
            border: 1px solid #1a1a1a;
            border-radius: 30px;
            padding: 40px;
            transition: 0.4s;
            height: 100%;
            text-decoration: none;
            color: white;
            display: block;
        }
        .contact-card:hover {
            border-color: var(--accent);
            transform: translateY(-10px);
            background: #121212;
        }
        .icon-circle {
            width: 60px;
            height: 60px;
            background: rgba(0, 212, 255, 0.1);
            color: var(--accent);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin-bottom: 20px;
        }

        .navbar-toggler { filter: invert(1); }
        @media (max-width: 991px) {
            .navbar-collapse { background: #111; padding: 20px; border-radius: 15px; margin-top: 10px; }
            .contact-header h1 { font-size: 2.5rem; }
        }
