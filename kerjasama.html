<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collab With Me</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0b0e14;
            background-image: radial-gradient(circle at 2px 2px, #1d2129 1px, transparent 0);
            background-size: 40px 40px;
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        .navbar-brand { font-weight: 800; color: #00d4ff !important; }
        
        .glass-form {
            background: rgba(22, 27, 34, 0.8);
            border: 1px solid #30363d;
            border-radius: 24px;
            padding: 50px;
            backdrop-filter: blur(10px);
        }

        .form-control, .form-select {
            background: #0b0e14;
            border: 1px solid #30363d;
            color: white;
            border-radius: 10px;
        }
        .form-control:focus { background: #0b0e14; color: white; border-color: #00d4ff; box-shadow: none; }
        
        label { font-size: 0.85rem; color: #8b949e; margin-bottom: 5px; }
        .btn-gradient { background: linear-gradient(90deg, #00d4ff, #008fb3); color: black; font-weight: bold; border: none; border-radius: 10px; padding: 12px; }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="text-center mb-4">
                <a href="index.html" class="text-decoration-none text-info">← Kembali ke Beranda</a>
            </div>
            
            <div class="glass-form shadow-lg">
                <h2 class="fw-bold mb-4">Mulai <span style="color: #00d4ff;">Kerjasama</span></h2>
                
                <form action="#" method="POST" enctype="multipart/form-data">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label>Nama Anda</label>
                            <input type="text" class="form-control">
                        </div>
                        <div class="col-md-6">
                            <label>Email Bisnis</label>
                            <input type="email" class="form-control">
                        </div>
                        
                        <div class="col-12">
                            <label>Pilih Jenis Proyek</label>
                            <select class="form-select">
                                <option > </option>
                                <option>Web Development</option>
                                <option>Design</option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label>Jadwal Meeting</label>
                            <input type="datetime-local" class="form-control">
                        </div>
                        
                        <div class="col-md-6">
                            <label class="d-block">Urgensi Proyek</label>
                            <div class="mt-2">
                                <input type="radio" name="p" id="r1"> <label for="r1" class="me-3">Urgent</label>
                                <input type="radio" name="p" id="r2"> <label for="r2">Santai</label>
                            </div>
                        </div>

                        <div class="col-12">
                            <label>Layanan Tambahan</label>
                            <div>
                                <input type="checkbox" id="c1"> <label for="c1" class="me-3">SEO</label>
                                <input type="checkbox" id="c2"> <label for="c2">Copywriting</label>
                            </div>
                        </div>

                        <div class="col-12">
                            <label>Upload File Brief</label>
                            <input type="file" class="form-control">
                        </div>

                        <div class="col-12">
                            <label>Catatan Tambahan</label>
                            <textarea class="form-control" rows="3"></textarea>
                        </div>

                        <div class="col-12 mt-4 d-grid gap-2">
                            <button type="submit" class="btn btn-gradient">Kirim Sekarang</button>
                            <button type="reset" class="btn btn-link text-secondary text-decoration-none">Reset Data</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
